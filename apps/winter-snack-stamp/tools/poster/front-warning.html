<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:Jua;src:url(Jua.ttf)}
html,body{margin:0;width:1024px;height:1536px;overflow:hidden}
body{background:url(base.png) 0 0/1024px 1536px no-repeat;font-family:Jua,sans-serif;position:relative}
.warn{position:absolute;left:34px;right:34px;top:1206px;height:154px;box-sizing:border-box;
  background:rgba(255,253,248,.95);border:5px solid #E04F3F;border-radius:30px;
  box-shadow:0 7px 0 rgba(170,55,40,.28),0 10px 24px rgba(60,80,120,.18);
  padding:31px 26px 0;color:#4A2416;text-align:center}
.tag{position:absolute;left:50%;top:-26px;transform:translateX(-50%);background:#E04F3F;color:#fff;
  font-size:30px;line-height:1;padding:9px 30px 8px;border-radius:999px;box-shadow:0 4px 0 #A8342A;white-space:nowrap;letter-spacing:2px}
.tag i{font-style:normal;font-family:'Noto Color Emoji';font-size:25px;letter-spacing:0;margin-right:8px;vertical-align:2px}
p{margin:0;font-size:25.5px;line-height:1.36;word-break:keep-all;letter-spacing:-.2px}
b{font-weight:400;color:#C8392B}
em{display:inline-block;font-style:normal;font-size:31px;line-height:1.25;margin-top:2px;color:#4B1F73;
  text-shadow:0 0 10px rgba(110,50,170,.35)}
em i{font-style:normal;font-family:'Noto Color Emoji';font-size:28px;margin-left:6px;text-shadow:none}
</style></head><body>
<div class="warn"><div class="tag"><i>⚠️</i>주의</div>
<p>이 이벤트는 <b>수업을 열심히 잘 듣자</b>는 취지로 실시되었습니다.<br>
안 먹고 열심히 안 하겠다는 마인드 혹은 이에 대해 부정적인 이야기를 할 시<br>
<em>담임쌤이 흑화하여 어떻게 될지 모릅니다.<i>😈</i></em></p></div>
</body></html>
