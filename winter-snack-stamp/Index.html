<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ───────── 색과 글꼴 ───────── */
:root{
  --cream:#FFF6E6; --paper:#FFFDF7; --ink:#4A2E1E; --ink2:#7A5A45; --muted:#A48A74; --line:#EBDCC6; --line2:#DCC8AA;
  --red:#D9473B; --red2:#B93A2F; --red-soft:#FCE6E1; --gold:#E9A24A; --gold2:#C9802C; --gold-soft:#FFF0CF;
  --snow:#DCEEF2; --mint:#2E9C82; --mint-soft:#E2F5EF; --navy:#1F2D52; --violet:#7B5BD6;
  --title:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  --emoji:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.5;background:var(--cream);
  background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.8) 0 1.6px,transparent 2.6px),radial-gradient(circle at 40% 80%,rgba(255,255,255,.7) 0 1.4px,transparent 2.4px);
  background-size:140px 140px,190px 190px,230px 230px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.title{font-family:var(--title);font-weight:400}

/* ───────── 포장마차 배경: 위쪽 빨간 물결 천막, 아래쪽 눈 덮인 산 ───────── */
#scene{position:fixed;inset:0;pointer-events:none;z-index:0}
.awning-wrap{position:absolute;left:0;right:0;top:0;filter:drop-shadow(0 4px 0 rgba(120,35,25,.16))}
.awning{height:64px;background:linear-gradient(rgba(70,10,5,.18) 0 9px,transparent 9px),repeating-linear-gradient(90deg,#D9473B 0 46px,#EF6F5F 46px 92px);
  -webkit-mask:radial-gradient(circle 23px at 23px 0,#000 97%,transparent 100%) bottom/46px 23px repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 23px) no-repeat;
          mask:radial-gradient(circle 23px at 23px 0,#000 97%,transparent 100%) bottom/46px 23px repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - 23px) no-repeat}
.hills{position:absolute;left:0;right:0;bottom:0;height:clamp(110px,22vh,200px)}
.hills svg{display:block;width:100%;height:100%}

/* ───────── 공통 ───────── */
#app{position:relative;z-index:2;min-height:100vh;padding:78px 16px 150px}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:1240px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:16px 18px}
.card + .card{margin-top:14px}
.card h3{font-family:var(--title);font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{color:var(--ink2);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font-family:var(--title);font-size:17px;line-height:1.2;background:#F3E6D2;color:var(--ink);box-shadow:0 3px 0 var(--line2);transition:transform .06s,box-shadow .06s,opacity .2s;white-space:nowrap;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 3px 0 var(--gold2)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 3px 0 #1F7562}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 3px 0 #10182F}
.btn.white{background:#fff;box-shadow:0 3px 0 var(--line)}
.btn.sm{padding:7px 12px;font-size:15px}
.btn.xs{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--line2)}
.btn.big{padding:15px 28px;font-size:22px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:800;font-size:14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.chip:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800;background:var(--gold-soft);color:var(--gold2)}
.pill.red{background:var(--red-soft);color:var(--red2)}
.pill.mint{background:var(--mint-soft);color:var(--mint)}
.pill.gray{background:#EFE8DE;color:var(--ink2)}
input[type=text],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{border:2px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;resize:vertical}
.bar{height:12px;border-radius:999px;background:#F1E4D0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#F6C46A)}
.bar.hop i{background:linear-gradient(90deg,#E9B98B,#F7DDBB)}
.bar.pg i{background:linear-gradient(90deg,#F08FA8,#F7B6C6)}
.center{text-align:center}
.page-title{font-family:var(--title);font-size:26px;line-height:1.2;display:flex;align-items:center;gap:10px}
.page-title .em{font-family:var(--emoji)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#FFF9EE;border:1.5px solid var(--line)}
.item .when{font-size:12px;color:var(--muted);white-space:nowrap}
.plus{color:var(--mint);font-weight:800}
.minus{color:var(--red);font-weight:800}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
th{font-size:12.5px;color:var(--ink2);background:#FBF2E4;position:sticky;top:0}
td.num,th.num{text-align:right}
.scroll{overflow:auto;max-height:68vh;border-radius:12px;border:1.5px solid var(--line)}

/* ───────── 알림·모달·효과 ───────── */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;max-width:92vw;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warn{background:var(--red2)}
#toast.good{background:var(--mint)}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(60,35,20,.45);display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--paper);border-radius:24px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line2);width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px 20px 18px;animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
.modal.wide{width:min(860px,100%)}
.modal h2{font-family:var(--title);font-weight:400;font-size:24px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.fx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.fx .msg{position:relative;font-family:var(--title);font-size:clamp(30px,6vw,64px);color:#fff;text-align:center;padding:18px 30px;border-radius:30px;background:rgba(74,46,30,.72);animation:pop .35s cubic-bezier(.2,1.4,.4,1);line-height:1.2;max-width:92vw}
.fx.gold .msg{background:linear-gradient(135deg,#F6C445,#E39A1E);text-shadow:0 2px 0 rgba(120,70,0,.4);box-shadow:0 0 60px rgba(255,200,60,.8)}
.fx.snow .msg{background:rgba(31,45,82,.82)}
.fx.pig .msg{background:linear-gradient(135deg,#F08FA8,#E5677F)}
.fx i{position:absolute;top:-30px;font-style:normal;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r,200deg))}}
.fx.up i{top:auto;bottom:-30px;animation-name:rise}
@keyframes rise{to{transform:translateY(-110vh) rotate(var(--r,200deg))}}

/* ───────── 숫자 입력판 ───────── */
.pinbox{width:min(360px,100%);margin:0 auto}
.dots{display:flex;justify-content:center;gap:12px;margin:14px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line2);background:#fff}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:66px;border-radius:20px;border:0;background:#fff;box-shadow:0 4px 0 var(--line);font-family:var(--title);font-size:28px}
.keys button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}

/* ───────── 교실 패드 ───────── */
.pad #app{padding:76px 18px 120px}
.lock{max-width:640px;margin:0 auto;text-align:center}
.lock .page-title{justify-content:center;font-size:34px}
.gauge{display:flex;align-items:center;gap:12px;text-align:left}
.gauge .pig{width:74px;flex:none}
.padhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.padhead .now{font-family:var(--title);font-size:28px}
.save{font-size:13px;font-weight:800;color:var(--mint)}
.save.saving{color:var(--gold2)}
.save.retry{color:var(--red)}
.readybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#EAF3F8;border:2px solid #CFE3EC;border-radius:18px;padding:10px 14px;margin-bottom:12px}
.readybar b{font-family:var(--title);font-weight:400;font-size:20px}
.recov{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FFF1DE;border:2px solid #F3C98F;border-radius:18px;padding:8px 14px;margin-bottom:12px}
.recov b{font-family:var(--title);font-weight:400;font-size:19px}
.name.rc{border-color:#F3C98F}
.name .rcp{display:inline-block;font-family:var(--body);font-size:11.5px;font-weight:800;color:#B86A12;background:#FFE7C2;border-radius:999px;padding:0 7px;letter-spacing:0;vertical-align:middle}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.name{position:relative;border:3px solid var(--line);background:#fff;border-radius:18px;padding:10px 8px 8px;text-align:center;box-shadow:0 3px 0 var(--line);min-height:84px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.name .no{position:absolute;left:9px;top:6px;font-size:13px;font-weight:800;color:var(--muted)}
.name .nm{font-family:var(--title);font-size:24px;line-height:1.2;margin-top:6px}
.name .mk{min-height:22px;font-family:var(--emoji);font-size:16px;letter-spacing:1px}
.name .mk .minus{font-family:var(--body);font-size:13px}
.name.on{background:#FFE7B8;border-color:var(--gold);box-shadow:0 3px 0 var(--gold2)}
.name.on::after{content:'✔';position:absolute;right:9px;top:4px;color:var(--gold2);font-size:18px;font-weight:800}
.tools{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,247,.96);border-top:3px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;backdrop-filter:blur(6px)}
.tools .btn{font-size:20px;padding:13px 18px;min-width:120px}
.tools .btn small{font-family:var(--body);font-size:13px;font-weight:800;opacity:.9}
.summary td{font-size:17px}

/* ───────── 학생 화면 ───────── */
.stuhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stuhead .page-title{font-size:23px}
.batter{display:flex;align-items:center;gap:14px}
.batter .art{width:84px;flex:none}
.batter .big{font-family:var(--title);font-size:40px;line-height:1}
.cpn-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cpn{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px 10px 12px;text-align:center;box-shadow:0 3px 0 var(--line)}
.cpn .art{width:100%;max-width:170px;margin:0 auto;display:block}
.cpn b{font-family:var(--title);font-weight:400;font-size:19px;display:block}
.cpn .cap{font-size:12.5px;color:var(--ink2);min-height:19px}
.cpn.full{border-color:var(--gold);background:#FFF5DA;animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 3px 0 var(--gold2),0 0 22px rgba(233,162,74,.55)}}
.stage{width:min(300px,80vw);margin:0 auto;display:block}
.stagecap{text-align:center;font-family:var(--title);font-size:21px;margin-top:-4px}
.board{background:#FFFBF2;border:2px dashed var(--line2);border-radius:22px;padding:14px 12px 12px;margin-top:10px;background-image:linear-gradient(rgba(233,162,74,.06) 1px,transparent 1px);background-size:100% 26px}
.board .bh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-bottom:10px;font-family:var(--title);font-size:17px}
.board .bh small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell-s{aspect-ratio:1;border-radius:50%;border:2.5px dashed #D9C4A4;display:grid;place-items:center;position:relative;color:#D9C4A4;font-size:12px;font-weight:800;background:#fff}
.cell-s.next{border-color:var(--gold);color:var(--gold2);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.07)}}
.cell-s.fill{border:0;background:none}
.cell-s .stk{position:absolute;inset:-6%;display:block}
.cell-s .stk svg,.cell-s .stk img{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 1px rgba(80,50,20,.25))}
.cell-s.pop .stk{animation:stick .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stick{from{transform:scale(1.9) rotate(-25deg);opacity:0}}
.cell-s.burn .stk{animation:burn 1.6s ease-in forwards}
@keyframes burn{60%{opacity:1;transform:scale(1.05)}to{opacity:0;transform:scale(.6) translateY(-10px)}}
.tabs{display:flex;gap:6px;background:#F3E6D2;border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font-family:var(--title);font-size:17px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.flavors{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.flavor{border:3px solid var(--line);background:#fff;border-radius:18px;padding:8px;text-align:center}
.flavor .art{width:100%;max-width:120px;display:block;margin:0 auto}
.flavor b{font-family:var(--title);font-weight:400;font-size:20px;display:block}
.flavor.on{border-color:var(--gold);background:#FFF2D5}
.flavor:disabled{filter:grayscale(1);opacity:.45}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.friend{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;font-weight:800;text-align:center}
.friend.on{border-color:var(--red);background:var(--red-soft)}
.friend:disabled{opacity:.4}
.count{font-weight:800;font-size:13px}
.count.ok{color:var(--mint)}
.count.no{color:var(--red)}
.rules{line-height:1.7}
.rules h4{font-family:var(--title);font-weight:400;font-size:20px;margin:16px 0 6px}
.rules ul{margin:0;padding-left:20px}
.rules li{margin:2px 0}
.ticket-scale{overflow:hidden;margin:0 auto;border-radius:8px}
.ticket-scale > div{transform-origin:0 0}
.tk-wrap{position:relative}
.done-stamp{position:absolute;right:8%;top:18%;transform:rotate(-14deg);border:4px solid var(--red);color:var(--red);font-family:var(--title);font-size:26px;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.75)}

/* ───────── 담임 화면 ───────── */
.admin #app{padding-top:76px}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.atabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-family:var(--title);font-size:16px;color:var(--ink2)}
.atabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.stat b{font-family:var(--title);font-weight:400;font-size:26px;display:block;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:700}
.mini{display:flex;align-items:center;gap:6px;min-width:120px}
.mini .bar{flex:1;height:9px}
.mini small{font-size:12px;color:var(--ink2);font-weight:800;min-width:42px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:13.5px}
.fld small{font-weight:600;color:var(--muted);font-size:12px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

/* ───────── 교환권 (쿠폰 출력기 모양) — 모든 크기는 실제 인쇄 크기 ───────── */
.tcell{position:relative;width:92mm;height:92mm;font-family:var(--body);color:var(--tk-ink);text-align:left;line-height:1.3;background:linear-gradient(90deg,var(--fa) 0 50%,var(--fb) 50% 100%)}
.ticket{position:absolute;left:4mm;top:4mm;width:84mm;height:84mm;overflow:hidden;background:#fff}
.tmain{position:absolute;left:0;top:0;width:84mm;height:54mm;background:#fff;padding:4.2mm 4.6mm 3.2mm 5mm;display:flex;flex-direction:column}
.thd{display:flex;align-items:flex-end;gap:1.5mm;height:6.6mm;flex:none}
.tto{font-family:var(--title);font-size:5.2mm;line-height:1;padding-bottom:.6mm}
.tnm{font-family:var(--title);font-size:5.2mm;line-height:1.15;padding:0 1.6mm .3mm;border-bottom:.45mm solid var(--pri);min-width:26mm;max-width:46mm;white-space:nowrap;overflow:hidden;text-align:center}
.tbadge{margin-left:auto;align-self:center;font-family:var(--mono);font-weight:700;font-size:2mm;letter-spacing:.5mm;color:var(--pri);border:.3mm solid currentColor;border-radius:5mm;padding:.6mm 1.4mm .5mm 1.9mm;line-height:1.2;white-space:nowrap}
.tbadge.re{font-family:var(--body);letter-spacing:0;font-size:2.4mm;background:var(--pri);color:#fff;border-color:var(--pri)}
.tbd{flex:1;min-height:0;display:flex;align-items:center;gap:2mm}
.ttx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1.2mm}
.tcamp{font-weight:800;font-size:3mm;white-space:nowrap;overflow:hidden;line-height:1.35}
.tl1{font-family:var(--title);font-size:7.4mm;line-height:1.08;color:var(--l1);white-space:nowrap;overflow:hidden}
.ttiles{display:flex;gap:1.2mm;padding:.5mm 0}
.ttiles span{width:12mm;height:12mm;border-radius:2.6mm;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;font-family:var(--title);font-size:8mm;line-height:1;flex:none}
.ttiles span:nth-child(2){transform:rotate(-7deg) translateY(.5mm)}
.tart{width:28mm;height:28mm;flex:none;position:relative;display:grid;place-items:center}
.tart::before{content:'';position:absolute;inset:1mm;border-radius:50%;background:var(--soft)}
.tart svg,.tart img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.ttags{display:flex;gap:1.3mm;white-space:nowrap;overflow:hidden;font-size:2.6mm;flex:none}
.ttags span{flex:none;display:inline-flex;align-items:center;height:2.2em;padding:0 1.05em;border-radius:2em;font-weight:800}
.ttags b{margin-right:.2em;opacity:.55}

<script>const BOOT = /*__BOOT__*/null;</script>
<script>
/* 그림 교체: ChatGPT로 그린 PNG를 tools/embed_art.py로 넣으면 여기에 채워져요. 비어 있으면 앱이 그린 기본 그림을 써요. */
const ART_IMAGES = {/*ART:BEGIN*/

<script>
'use strict';
/* ════════════════════════ 기본 도구 ════════════════════════ */
const Q = new URLSearchParams(location.search);
const B = (function () {
  const b = (typeof BOOT !== 'undefined' && BOOT) || {};
  return { view: b.view || (Q.get('s') ? 'student' : (Q.get('v') || 'home')), code: b.code || Q.get('s') || '', url: b.url || '' };
})();
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const store = {
  get(k, s) { try { return (s ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
  set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} },
  del(k, s) { try { (s ? sessionStorage : localStorage).removeItem(k); } catch (e) {} },
};
let SESSION_TOKEN = '';

function call(action, payload) {
  return new Promise((resolve, reject) => {
    const req = { action, payload: payload || {}, token: SESSION_TOKEN, code: B.code };
    const done = (res) => (res && res.ok ? resolve(res.data) : reject(res || { code: 'ERROR', msg: '응답이 없어요.' }));
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(() => reject({ code: 'NET', msg: '연결이 불안정해요. 잠시 뒤 다시 시도해요.' })).api(req);
    } else if (window.__mockApi) {
      Promise.resolve(window.__mockApi(req)).then(done, (e) => reject({ code: 'NET', msg: String(e) }));
    } else {
      reject({ code: 'NET', msg: '서버에 연결할 수 없어요.' });
    }
  });
}

let toastTimer;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}
function modal(html, cls) {
  $('#modalRoot').innerHTML = '<div class="modal-bg" data-act="modalBg"><div class="modal ' + (cls || '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function confirmBox(title, body, okLabel, okClass) {
  return new Promise((resolve) => {
    modal('<h2>' + title + '</h2><div>' + body + '</div><div class="actions"><button class="btn white" id="cfNo">취소</button><button class="btn ' + (okClass || 'red') + '" id="cfYes">' + (okLabel || '확인') + '</button></div>');
    $('#cfNo').onclick = () => { closeModal(); resolve(false); };
    $('#cfYes').onclick = () => { closeModal(); resolve(true); };
  });
}
function fmtDate(d) { if (!d) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); return m ? Number(m[2]) + '월 ' + Number(m[3]) + '일' : d; }
function fmtWhen(ts) { const m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(ts || ''); return m ? Number(m[1]) + '/' + Number(m[2]) + ' ' + m[3] + ':' + m[4] : ''; }
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let h = hash(seed) || 1; return () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; }; }
/** 칭찬 글자 수 (서버와 같은 규칙): 완성 한글·영어·숫자만, 같은 글자 3번 이상 이어지면 1글자 */
function praiseLen(text) {
  let n = 0, prev = '', run = 0;
  Array.from(String(text || '')).forEach((ch) => {
    if (!/[가-힣A-Za-z0-9]/.test(ch)) { prev = ''; run = 0; return; }
    if (ch === prev) { run++; if (run === 2) n++; else if (run === 3) n--; } else { prev = ch; run = 1; n++; }
  });
  return n;
}

/* ════════════════════════ 소리 (파일 없이 만들어요) ════════════════════════ */
const Sound = {
  on: store.get('wss:sound') !== '0',
  ctx: null,
  ac() { if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  tone(freq, dur, type, vol, delay, slideTo) {
    const ac = this.ac(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, freq, vol, delay) {
    const ac = this.ac(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq || 2500;
    const g = ac.createGain(); g.gain.setValueAtTime(vol || 0.12, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t0);
  },
  play(name) {
    if (!this.on) return;
    try {
      if (name === 'tick') this.tone(880, 0.07, 'triangle', 0.12);
      else if (name === 'stamp') { this.tone(520, 0.12, 'triangle', 0.18); this.tone(780, 0.14, 'sine', 0.12, 0.06); }
      else if (name === 'sizzle') { this.noise(0.55, 3200, 0.1); this.tone(300, 0.1, 'triangle', 0.1); }
      else if (name === 'poof') { this.tone(420, 0.28, 'sine', 0.22, 0, 130); this.noise(0.18, 800, 0.05); }
      else if (name === 'ding') { this.tone(1320, 1.4, 'sine', 0.25); this.tone(1980, 1.0, 'sine', 0.1); this.tone(1320, 1.2, 'sine', 0.2, 0.25); }
      else if (name === 'gold') [784, 988, 1175, 1568, 1976].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.16, i * 0.08));
      else if (name === 'coin') { this.tone(988, 0.08, 'square', 0.08); this.tone(1319, 0.3, 'square', 0.08, 0.08); }
      else if (name === 'burn') { this.noise(0.8, 600, 0.08); this.tone(180, 0.4, 'sawtooth', 0.05, 0, 90); }
      else if (name === 'minus') this.tone(330, 0.25, 'triangle', 0.15, 0, 220);
      else if (name === 'yay') [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.15, i * 0.09));

  toggle() { this.on = !this.on; store.set('wss:sound', this.on ? '1' : '0'); },

/* ════════════════════════ 효과 ════════════════════════ */
function fx(kind, text, ms) {
  const sets = { gold: ['✨', '⭐', '🌟', '✨'], snow: ['❄', '❅', '❆', '❄'], pig: ['🪙', '🪙', '✨', '🐷'], yay: ['🎉', '✨', '🎊', '⭐'], burn: ['💨', '💨', '🔥'] };
  const icons = sets[kind] || sets.yay;
  let parts = '';
  for (let i = 0; i < 46; i++) {
    const left = Math.random() * 100, dur = 2.2 + Math.random() * 2.2, delay = Math.random() * 0.9, size = 18 + Math.random() * 26;
    parts += '<i style="left:' + left + '%;animation-duration:' + dur + 's;animation-delay:' + delay + 's;font-size:' + size + 'px;--r:' + (Math.random() * 540 - 270) + 'deg">' + icons[i % icons.length] + '</i>';
  }
  const el = document.createElement('div');
  el.className = 'fx ' + kind + (kind === 'pig' ? ' up' : '');
  el.innerHTML = parts + (text ? '<div class="msg">' + text + '</div>' : '');
  $('#fxRoot').appendChild(el);
  setTimeout(() => el.remove(), ms || 3200);
}

/* ════════════════════════ 그림 (기본은 직접 그린 SVG, PNG가 있으면 PNG) ════════════════════════ */
const Art = {

  stickerBurnt(kind) {

      const inner = kind === 'hop' ? this.bunBody('#4A3428', '#22150D', '#2B1D16') : this.fishBody('#4A3428', '#22150D', '#1A110C', { eye: false });

    return '<div class="lock"><div class="card"><div class="page-title" style="font-size:26px">📋 ' + (s.period > 0 ? s.period + '교시 ' : '') + esc(s.subject) + ' 수업 요약</div>' +

  applyLocal(op) {
    const v = this.view; if (!v || !v.lesson) return;

      if (p.tool === 'ready') { v.lesson.ready = true; v.students.forEach((s) => { m(s.no).ready = 1; }); return; }

  async pump() {

      const res = await call(op.action, op.payload);

      if (op.action !== 'undo') this.undo.push({ target: op.payload.actionId, label: op.label });
      this.setView(res.view || res);
      if (res.golden && res.golden.length) {
        Sound.play('gold');
        fx('gold', res.golden.map((g) => '✨ ' + esc(g.name) + ' 황금 붕어빵! +' + g.amount).join('<br>'), 3800);
      }
      if (res.recovered && res.recovered.length) toast('🔄 되찾기 찬스: ' + res.recovered.map((no) => this.nameOf(no)).join(', ') + ' +1', 'good');
      if (res.skipped && res.skipped.length) toast('이미 받은 학생은 건너뛰었어요: ' + res.skipped.map((no) => this.nameOf(no)).join(', '));

    } catch (e) {
      if (e.code === 'NET' || e.code === 'BUSY') {

      }

  },
  pickChip(t) {
    document.querySelectorAll('[data-group="' + t.dataset.group + '"]').forEach((b) => b.classList.toggle('on', b === t));
  },
});

  coupon(c, anim) {

  async stamp(n) {

      '<p class="hint">아직 안 찍은 반죽만 기부할 수 있어요. (지금 ' + v.unstamped + '개)</p>' +

      '<div class="row" style="justify-content:space-between;margin-top:4px"><span class="count no" id="prCount">0 / ' + v.rules.praiseMinChars + '글자</span><span class="small muted">보낸 사람 이름과 함께 바로 보여요</span></div>' +

    } catch (e) { toast(e.msg, 'warn'); $('#prSend').disabled = false; }

  stuPraiseList() { Stu.praiseList(); },
});
